server:
  http_listen_port: 9080
  grpc_listen_port: 9095

clients:
  - url: http://loki:3100/api/prom/push

positions:
  filename: /tmp/positions.yaml

scrape_configs:
  - job_name: 'varlogs'
    static_configs:
      - targets: ['localhost']
        labels:
          job: 'varlogs'
          __path__: /var/log/*.log

# Docker logs for 'api' service
  - job_name: 'docker-api-service'
    static_configs:
      - targets: ['localhost']
        labels:
          job: 'docker-api-service'
          __path__: '/var/lib/docker/containers/*/api*-json.log'
          